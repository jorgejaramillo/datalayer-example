<main class="min-h-[calc(100dvh-80px)]">
  <div class="mx-auto max-w-4xl px-4 py-12 prose prose-slate"><h1 class='text-3xl font-semibold'>Carrito</h1><p class='mt-2 text-slate-600'>Revisa tus productos antes de pagar. Todos son ficticios.</p><div id='lista' class='mt-8'></div><div id='resumen' class='mt-6'></div><script>var KEY='dl_cart';window.dataLayer=window.dataLayer||[];function getCart(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return []}}function saveCart(c){try{localStorage.setItem(KEY,JSON.stringify(c))}catch(e){}}function totalCart(c){return c.reduce(function(s,i){return s+i.price*i.quantity},0)}function toItems(c){return c.map(function(i){return {item_id:i.id,item_name:i.name,price:i.price,quantity:i.quantity}})}function draw(){var c=getCart();var lista=document.getElementById('lista');var res=document.getElementById('resumen');if(!c.length){lista.innerHTML=`<p>Tu carrito está vacío.</p><p class='mt-4'><a href='plp.html' class='underline'>Ir al catálogo</a></p>`;res.innerHTML='';return;}lista.innerHTML=c.map(function(i){return `<div class='flex justify-between items-center border-b py-4'><div><p class='font-semibold'>${i.name}</p><p class='text-sm text-slate-600'>${i.id} · ${i.price.toFixed(2)} USD</p></div><div class='flex items-center gap-2'><button type='button' data-menos='${i.id}' class='border rounded px-2'>-</button><span>${i.quantity}</span><button type='button' data-mas='${i.id}' class='border rounded px-2'>+</button><button type='button' data-quitar='${i.id}' class='underline text-sm ml-3'>Quitar</button></div></div>`}).join('');res.innerHTML=`<p>Subtotal: <strong>${totalCart(c).toFixed(2)} USD</strong></p><p class='text-sm text-slate-600'>El envío se calcula en el checkout.</p><a href='checkout-tienda.html' class='inline-block mt-4 rounded bg-black text-white px-5 py-3'>Ir a pagar</a>`;}function buscar(c,id){return c.filter(function(x){return x.id===id})[0];}draw();if(getCart().length){dataLayer.push({event:'view_cart',ecommerce:{currency:'USD',value:totalCart(getCart()),items:toItems(getCart())}});}document.getElementById('lista').addEventListener('click',function(e){var t=e.target;var id=t.getAttribute('data-mas');if(id){var c=getCart();var it=buscar(c,id);it.quantity+=1;saveCart(c);dataLayer.push({event:'add_to_cart',ecommerce:{currency:'USD',value:it.price,items:[{item_id:it.id,item_name:it.name,price:it.price,quantity:1}]}});draw();return;}id=t.getAttribute('data-menos');if(id){var c2=getCart();var it2=buscar(c2,id);if(it2.quantity>1){it2.quantity-=1;saveCart(c2);dataLayer.push({event:'remove_from_cart',ecommerce:{currency:'USD',value:it2.price,items:[{item_id:it2.id,item_name:it2.name,price:it2.price,quantity:1}]}});}draw();return;}id=t.getAttribute('data-quitar');if(id){var c3=getCart();var it3=buscar(c3,id);c3=c3.filter(function(x){return x.id!==id});saveCart(c3);dataLayer.push({event:'remove_from_cart',ecommerce:{currency:'USD',value:it3.price*it3.quantity,items:[{item_id:it3.id,item_name:it3.name,price:it3.price,quantity:it3.quantity}]}});draw();}});</script></div>

<script>
  const menuToggle = document.getElementById('menu-toggle');
  const mobileMenu = document.getElementById('mobile-menu');
  const closeMenu = () => {
    mobileMenu.classList.add('hidden');
    menuToggle.setAttribute('aria-expanded', 'false');
    menuToggle.setAttribute('aria-label', 'Abrir menú');
  };
  menuToggle.addEventListener('click', () => {
    const isOpen = menuToggle.getAttribute('aria-expanded') === 'true';
    if (isOpen) {
      closeMenu();
    } else {
      mobileMenu.classList.remove('hidden');
      menuToggle.setAttribute('aria-expanded', 'true');
      menuToggle.setAttribute('aria-label', 'Cerrar menú');
    }
  });
  mobileMenu.querySelectorAll('a').forEach((link) => link.addEventListener('click', closeMenu));
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && menuToggle.getAttribute('aria-expanded') === 'true') closeMenu();
  });
</script>
