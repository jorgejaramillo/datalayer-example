<main class="min-h-[calc(100dvh-80px)]">
  <div class="mx-auto max-w-4xl px-4 py-12 prose prose-slate"><p class='mb-6'><a href='plp.html' class='underline'>Volver al catálogo</a> · Carrito: <a href='carrito.html' class='underline'><span id='contador'>0</span> artículos</a></p><div id='detalle' class='grid gap-10 md:grid-cols-2'></div><script>var KEY='dl_cart';var IMG='https://media.stronglify.com/295/nexus-13-1791317567-1791468612.png';var CATALOGO=[{id:'SKU-001',slug:'plan-mensual',name:'Plan mensual',price:59.90,desc:'Acceso ilimitado de prueba durante un mes. Producto ficticio.'},{id:'SKU-002',slug:'camiseta-de-prueba',name:'Camiseta de prueba',price:19.00,desc:'Camiseta de algodón ficticia, talla M.'},{id:'SKU-003',slug:'taza-de-prueba',name:'Taza de prueba',price:12.50,desc:'Taza de cerámica ficticia de 350 ml.'},{id:'SKU-004',slug:'gorra-de-prueba',name:'Gorra de prueba',price:15.00,desc:'Gorra ajustable de prueba.'}];window.dataLayer=window.dataLayer||[];function getCart(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return []}}function saveCart(c){try{localStorage.setItem(KEY,JSON.stringify(c))}catch(e){}}function cuenta(){var n=getCart().reduce(function(s,i){return s+i.quantity},0);var el=document.getElementById('contador');if(el)el.textContent=n;}function addToCart(id,qty){var p=CATALOGO.filter(function(x){return x.id===id})[0];if(!p)return;var c=getCart();var f=c.filter(function(x){return x.id===id})[0];if(f){f.quantity+=qty}else{c.push({id:p.id,name:p.name,price:p.price,quantity:qty})}saveCart(c);cuenta();dataLayer.push({event:'add_to_cart',ecommerce:{currency:'USD',value:p.price*qty,items:[{item_id:p.id,item_name:p.name,price:p.price,quantity:qty}]}});}var slug=new URLSearchParams(location.search).get('producto')||'plan-mensual';var p=CATALOGO.filter(function(x){return x.slug===slug})[0]||CATALOGO[0];document.getElementById('detalle').innerHTML=`<img src='${IMG}' alt='${p.name}' class='w-full rounded-xl'><div><p class='text-sm text-slate-500'>SKU: ${p.id}</p><h1 class='text-3xl font-semibold mt-2'>${p.name}</h1><p class='text-2xl font-semibold mt-4'>${p.price.toFixed(2)} USD</p><p class='mt-6 text-slate-700'>${p.desc}</p><div class='mt-8 flex gap-4 items-center'><label>Cantidad <input id='qty' type='number' min='1' value='1' class='border rounded px-2 py-1 w-20'></label><button id='agregar' type='button' class='rounded bg-black text-white px-5 py-3'>Agregar al carrito</button></div></div>`;cuenta();dataLayer.push({event:'view_item',ecommerce:{currency:'USD',value:p.price,items:[{item_id:p.id,item_name:p.name,price:p.price,quantity:1}]}});document.getElementById('agregar').addEventListener('click',function(){var q=parseInt(document.getElementById('qty').value,10)||1;addToCart(p.id,q);dataLayer.push({event:'add_to_cart',ecommerce:{currency:'USD',value:0,items:[{item_id:'TEST-000',item_name:'Evento falso de prueba',price:0,quantity:1}]}});});</script></div>

<script>
  const menuToggle = document.getElementById('menu-toggle');
  const mobileMenu = document.getElementById('mobile-menu');
  const closeMenu = () => {
    mobileMenu.classList.add('hidden');
    menuToggle.setAttribute('aria-expanded', 'false');
    menuToggle.setAttribute('aria-label', 'Abrir menú');
  };
  menuToggle.addEventListener('click', () => {
    const isOpen = menuToggle.getAttribute('aria-expanded') === 'true';
    if (isOpen) {
      closeMenu();
    } else {
      mobileMenu.classList.remove('hidden');
      menuToggle.setAttribute('aria-expanded', 'true');
      menuToggle.setAttribute('aria-label', 'Cerrar menú');
    }
  });
  mobileMenu.querySelectorAll('a').forEach((link) => link.addEventListener('click', closeMenu));
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && menuToggle.getAttribute('aria-expanded') === 'true') closeMenu();
  });
</script>
